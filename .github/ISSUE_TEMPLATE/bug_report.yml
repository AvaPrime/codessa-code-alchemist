name: Bug report
description: Report a reproducible problem with expected vs actual behavior
title: "Fix: <component> - <symptom/context>"
labels:
  - type: bug
  - priority: medium
  - component: backend
body:
  - type: markdown
    attributes:
      value: |
        Provide clear steps to reproduce, expected behavior, and environment details.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken? Summarize the bug.
      placeholder: Brief summary of the issue and impact
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Step-by-step actions to reproduce the issue
      placeholder: |
        1) Action A
        2) Action B
        3) Observe behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What actually happened (include logs/errors)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, runtime versions, branch/commit
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Define pass/fail checks and success metrics
      placeholder: |
        - Repro steps no longer reproduce
        - Unit test added covering case X
        - Error rate reduced below threshold
    validations:
      required: true
  - type: input
    id: effort
    attributes:
      label: Effort Estimate
      placeholder: e.g., 5 story points or 8 hours
    validations:
      required: false
  - type: input
    id: milestone
    attributes:
      label: Target Milestone
      placeholder: e.g., Validation & Readiness
    validations:
      required: false

