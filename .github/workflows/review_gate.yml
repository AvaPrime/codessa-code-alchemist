name: Review Gate

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, ready_for_review]
    branches: [ main ]

jobs:
  review-gate:
    name: review-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check minimum review duration for significant changes
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No PR context; passing');
              return;
            }
            const labels = pr.labels.map(l => l.name.toLowerCase());
            const isSignificant = labels.includes('significant-change');
            if (!isSignificant) {
              core.info('PR not labeled significant-change; passing');
              return;
            }
            const created = new Date(pr.created_at);
            const now = new Date();
            const ms = now - created;
            const hours = ms / 36e5;
            if (hours < 24) {
              core.setFailed(`Significant change requires >= 1 business day (~24h). Currently ${hours.toFixed(2)}h`);
            } else {
              core.info('Minimum review duration satisfied');
            }

